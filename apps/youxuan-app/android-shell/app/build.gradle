plugins {
    id 'com.android.application'
}

android {
    namespace 'com.appsp.youxuan'
    compileSdk 34

    defaultConfig {
        applicationId "com.appsp.youxuan"
        minSdk 21
        targetSdk 34
        versionCode 10000
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
