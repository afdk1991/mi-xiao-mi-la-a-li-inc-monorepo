# ============================================================
# mixm.top —— 本地 HTTP 站点配置（Docker Compose 挂载到 conf.d）
# 静态资源直接服务；/api/ 保留前缀反代到平台 API（宿主 node-api:3001）。
# 生产环境请使用 mixm.top.conf（Let's Encrypt HTTPS）。
# ============================================================
server {
    listen       80;
    server_name  mixm.top www.mixm.top localhost;

    root /var/www/mixm.top/public;
    index index.html;

    # 站点图标与 PWA 资源：长期缓存
    location ~* \.(ico|png|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 静态资源
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA 前端路由：未命中回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API：保留 /api/ 前缀反代到平台（node-api 宿主 3001）
    location /api/ {
        proxy_pass         http://host.docker.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 平台概览（34 行业模块）：/api/platform → node-api 根路由
    location = /api/platform {
        proxy_pass         http://host.docker.internal:3001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
