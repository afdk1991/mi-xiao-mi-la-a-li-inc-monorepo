# ============================================================
# mixm.top —— Nginx 站点配置（Docker Compose 部署）
# 约定：静态资源由本 server 直接服务，/api/ 反代到后端服务，
#       proxy_pass 保留 /api/ 前缀（与既有 node-api 路由一致）。
# 证书：Let's Encrypt 自动签发，路径 /etc/letsencrypt/live/mixm.top/
# ============================================================

# 80 端口：强制跳转 HTTPS
server {
    listen 80;
    server_name mixm.top www.mixm.top;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# 443 端口：静态站点 + API 反代
server {
    listen 443 ssl;
    server_name mixm.top www.mixm.top;

    # SSL（Let's Encrypt，自动续期）
    ssl_certificate     /etc/letsencrypt/live/mixm.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mixm.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 静态站点根目录（部署时把 sites/mixm.top/public/ 挂载到此处）
    root /var/www/mixm.top/public;
    index index.html;

    # 站点图标与 PWA 资源（长期缓存）
    location ~* \.(ico|png|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 前端路由：未命中文件时回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API：保留 /api/ 前缀反代到 node-api 服务
    # （Docker Compose 网络内服务名 node-api，容器内部监听端口 3001 —— 已实测确认）
    location /api/ {
        proxy_pass         http://node-api:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
