name: Deploy delivery-router to EdgeOne

# ============================================================
#  把 apps/delivery-router（Vite + React + Leaflet）部署到 EdgeOne Pages
# ============================================================
#  环境映射：
#    pull_request        -> preview
#    push to master      -> production
#    workflow_dispatch   -> 手动指定 environment
#
#  构建链路：npm ci --ignore-scripts -> npm run build (tsc -b && vite build) -> dist
#    * --ignore-scripts 用于跳过 Electron 二进制下载（本作业只需 Web 产物，可显著提速）
#    * dist/ 不含 package.json，符合 EdgeOne 静态部署要求
#
#  前置：仓库 Secrets 需配置 EDGEONE_API_TOKEN
# ============================================================
on:
  push:
    branches: [master]
    paths:
      - 'apps/delivery-router/**'
      - '.github/workflows/deploy-edgeone-app.yml'
  pull_request:
    branches: [master]
    paths:
      - 'apps/delivery-router/**'
  workflow_dispatch:
    inputs:
      environment:
        description: '部署目标环境'
        required: true
        type: choice
        options: [production, preview]
        default: production

permissions:
  contents: read
  packages: read   # 允许构建步骤经 .npmrc 拉取 @afdk1991/* 私有共享包

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/delivery-router
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve target environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "target=preview" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.environment || 'production' }}" >> "$GITHUB_OUTPUT"
          else
            echo "target=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify EdgeOne token is configured
        run: |
          if [ -z "${{ secrets.EDGEONE_API_TOKEN }}" ]; then
            echo "::error::缺少 EDGEONE_API_TOKEN。请到 Settings > Secrets and variables > Actions 添加该 Secret（值取自 EdgeOne Pages 控制台的 API Token）。"
            exit 1
          fi

      - name: Export GitHub Packages token
        run: echo "NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Deploy to EdgeOne Pages
        id: edgeone
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          TARGET_ENV: ${{ steps.env.outputs.target }}
        run: |
          npx --yes edgeone pages deploy dist \
            -n delivery-router \
            -t "$EDGEONE_API_TOKEN" \
            -e "$TARGET_ENV" 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[^ ]+\.edgeone\.cool[^ ]*' deploy.log | head -1)
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "### 🚚 delivery-router 部署完成"
            echo ""
            echo "- Project: \`delivery-router\`"
            echo "- Environment: \`${{ steps.env.outputs.target }}\`"
            echo "- Build output: \`apps/delivery-router/dist\`"
            if [ -n "${{ steps.edgeone.outputs.url }}" ]; then
              echo "- URL: ${{ steps.edgeone.outputs.url }}"
            else
              echo "- URL: 见上方 Deploy 步骤输出（务必保留含 \`?eo_token=\` 的完整链接）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
