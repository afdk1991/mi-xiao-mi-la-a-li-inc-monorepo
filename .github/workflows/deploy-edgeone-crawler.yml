name: Deploy price-crawler to EdgeOne

# ============================================================
#  把 services/price-crawler/edgeone-makers（比价探针 fullstack）
#  部署到 EdgeOne Pages/Makers 项目 price-collector-demo
# ============================================================
#  环境映射：
#    pull_request        -> preview
#    push to master      -> production
#    workflow_dispatch   -> 手动指定 environment
#
#  产物形态：edgeone-makers/ 为自包含部署目录
#    · index.html / app.js / style.css  静态资源
#    · functions/api/health.js、functions/api/search.js  Pages Functions
#    （修复此前线上 /api/search 404：部署产物中缺少该函数）
#
#  前置：仓库 Secrets 需配置 EDGEONE_API_TOKEN（与其他 EdgeOne 工作流共用）
# ============================================================
on:
  push:
    branches: [master]
    paths:
      - 'services/price-crawler/**'
      - '.github/workflows/deploy-edgeone-crawler.yml'
  pull_request:
    branches: [master]
    paths:
      - 'services/price-crawler/**'
  workflow_dispatch:
    inputs:
      environment:
        description: '部署目标环境'
        required: true
        type: choice
        options: [production, preview]
        default: production

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "target=preview" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.environment || 'production' }}" >> "$GITHUB_OUTPUT"
          else
            echo "target=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify EdgeOne token is configured
        run: |
          if [ -z "${{ secrets.EDGEONE_API_TOKEN }}" ]; then
            echo "::error::缺少 EDGEONE_API_TOKEN。请到 Settings > Secrets and variables > Actions 添加该 Secret（值取自 EdgeOne Pages 控制台的 API Token）。"
            exit 1
          fi

      - name: Deploy to EdgeOne (price-collector-demo)
        id: edgeone
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          TARGET_ENV: ${{ steps.env.outputs.target }}
        run: |
          npx --yes edgeone pages deploy services/price-crawler/edgeone-makers \
            -n price-collector-demo \
            -t "$EDGEONE_API_TOKEN" \
            -e "$TARGET_ENV" 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[^ ]+\.edgeone\.cool[^ ]*' deploy.log | head -1)
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "### 🕷️ price-crawler 部署完成"
            echo ""
            echo "- Project: \`price-collector-demo\`"
            echo "- Environment: \`${{ steps.env.outputs.target }}\`"
            echo "- Source: \`services/price-crawler/edgeone-makers\`（静态资源 + Pages Functions）"
            if [ -n "${{ steps.edgeone.outputs.url }}" ]; then
              echo "- URL: ${{ steps.edgeone.outputs.url }}"
            else
              echo "- URL: 见上方 Deploy 步骤输出（务必保留含 \`?eo_token=\` 的完整链接）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
