name: Publish npm packages to GitHub Packages

# ============================================================
#  把 shared/* 共享库发布到 GitHub Packages（npm registry）
# ============================================================
#  触发时机：
#   1) 推送到 master 且 shared/** 有变更（自动）
#   2) 手动 workflow_dispatch（可勾选 force 强制重发）
#
#  依赖顺序（重要）：
#    shared-config 在源码中 import @afdk1991/shared-map，
#    因此必须先发布 map，再发布 config。本工作流用「单 job 顺序步骤」
#    保证构建顺序，且构建时直接用根安装的 tsc + tsconfig paths 解析
#    ../map/dist，避免 npm install 去拉取尚未发布的 map 依赖。
#
#  幂等设计：发布前先用 npm view 探测该版本是否已存在，
#            已存在则跳过，避免 "You cannot publish over the previously published version" 报错。
#
#  鉴权：统一使用内置 GITHUB_TOKEN（已通过 permissions.packages: write 授权），
#        无需用户额外创建 PAT。
# ============================================================
on:
  push:
    branches: [master]
    paths:
      - 'shared/**'
      - '.github/workflows/publish-packages.yml'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新发布（忽略版本是否已存在）'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@afdk1991'

      # 根安装 tsc，供三个包共用；构建时通过 tsconfig paths 解析 ../map/dist
      - name: Install build tooling (typescript)
        run: npm install -g typescript@5.9.3

      - name: Publish @afdk1991/shared-map
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: shared/map
        run: |
          VER=$(node -p "require('./package.json').version")
          # 构建必须无条件执行：即使该版本已发布而跳过 publish，
          # 后续 shared-config 仍依赖 ../map/dist 解析 @afdk1991/shared-map 类型。
          npx tsc -p tsconfig.build.json
          if [ "${{ inputs.force }}" != "true" ] && npm view "@afdk1991/shared-map@$VER" version >/dev/null 2>&1; then
            echo "::notice::@afdk1991/shared-map@$VER already published -> skip"
          else
            npm publish
            echo "::notice::🚀 @afdk1991/shared-map@$VER published"
          fi

      - name: Publish @afdk1991/shared-http
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: shared/http
        run: |
          VER=$(node -p "require('./package.json').version")
          npx tsc -p tsconfig.build.json
          if [ "${{ inputs.force }}" != "true" ] && npm view "@afdk1991/shared-http@$VER" version >/dev/null 2>&1; then
            echo "::notice::@afdk1991/shared-http@$VER already published -> skip"
          else
            npm publish
            echo "::notice::🚀 @afdk1991/shared-http@$VER published"
          fi

      - name: Publish @afdk1991/shared-config
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: shared/config
        run: |
          VER=$(node -p "require('./package.json').version")
          # ../map/dist 由 map 步骤无条件构建产出，tsconfig paths 据此解析 @afdk1991/shared-map
          npx tsc -p tsconfig.build.json
          if [ "${{ inputs.force }}" != "true" ] && npm view "@afdk1991/shared-config@$VER" version >/dev/null 2>&1; then
            echo "::notice::@afdk1991/shared-config@$VER already published -> skip"
          else
            npm publish
            echo "::notice::🚀 @afdk1991/shared-config@$VER published"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### 📦 GitHub Packages 发布结果"
            echo ""
            echo "- @afdk1991/shared-map"
            echo "- @afdk1991/shared-http"
            echo "- @afdk1991/shared-config（依赖 map，已按序发布）"
            echo ""
            echo "Registry: npm.pkg.github.com"
          } >> "$GITHUB_STEP_SUMMARY"
