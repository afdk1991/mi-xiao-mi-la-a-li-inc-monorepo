name: Secret Guard

# 敏感信息防护门禁：确保 API 密钥 / 令牌 / 数据库凭据 / 私钥 / 环境变量
# 不会出现在前端代码、页面内容、网络请求或构建产物中。
#
# 检查三件事：
#   1. 全仓静态扫描：源码 + 构建产物中不得出现明文密钥（🔴/🟡 阻断，🟢 仅提示）
#   2. 环境文件不得入库：.gitignore 只对「未跟踪」文件生效，已入库的 .env 会绕过规则，
#      因此这里直接校验 git 索引，防止 .env 再次混入（本仓库曾发生）
#   3. 构建产物不得入库：dist 等产物会把 VITE_*/REACT_APP_* 内联进去，必须排除
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan source tree
        run: node tools/secret-scan.mjs

      - name: Scan including build artifacts
        run: node tools/secret-scan.mjs --include-build

  tracked-files:
    name: verify no env / build artifacts tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No tracked .env files (except .example templates)
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env' | grep -vE '\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::以下环境文件被 git 跟踪（.gitignore 对已跟踪文件无效，需先 git rm --cached）："
            echo "$bad"
            exit 1
          fi
          echo "✅ 无被跟踪的 .env 文件"

      - name: No tracked build artifacts (WordPress core dist excluded)
        run: |
          # 排除 WordPress 核心自带的 wp-includes/{js,css}/dist（官方目录名，非构建产物）
          bad=$(git ls-files \
            | grep -iE '/dist/|dist-assets|deploy-script-assets' \
            | grep -vE 'wp-includes/(js|css)/dist/' || true)
          if [ -n "$bad" ]; then
            echo "::error::以下构建产物被 git 跟踪（应 git rm --cached 并加入 .gitignore）："
            echo "$bad" | head -40
            exit 1
          fi
          echo "✅ 无被跟踪的构建产物"
