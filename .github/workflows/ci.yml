name: CI

# 轻量结构冒烟测试：无需安装依赖，验证 monorepo 编排器可正常发现全部模块。
on:
  push:
    branches: [master]
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify monorepo structure (zero-dependency)
        run: node run.mjs list
