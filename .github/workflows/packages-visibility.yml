name: Packages visibility

# 目的：三平台公开要求 GitHub Packages 上的包对外可见，本工作流提供「确定性核验」。
#
# 已知平台限制（2026-10-16 实测 + 官方文档核对）：
#   1. GitHub 的 npm registry 对「所有」请求强制鉴权，匿名访问统一 403，无法据此判断公私。
#   2. 本机可用令牌（gho_ OAuth）不含 read:packages / write:packages scope → 403。
#   3. GitHub REST API **不提供**修改包可见性的端点：
#      /user/packages/{type}/{name}/visibility 与 /users/{owner}/.../visibility 均返回
#      404 Not Found（官方文档中 visibility 仅为列表过滤参数与只读响应字段，无写入端点）。
#      → 可见性变更只能在网页端完成：github.com/users/<owner>/packages → 各包 →
#        Package settings → Change visibility → Public。
#   4. 但 Actions 的 GITHUB_TOKEN 具备 packages: write，**可以确定性读取**可见性（HTTP 200）。
#      因此本工作流保留「读取核验」价值：每次发布后自动确认三个包是否已是 public，
#      非 public 时以 warning 提示（不阻断构建，因为该项无法由 CI 代改）。
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/packages-visibility.yml'

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: verify packages are public
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
      PKGS: shared-map shared-http shared-config
    steps:
      - name: Read current visibility
        run: |
          all_public=true
          for p in $PKGS; do
            vis=$(curl -sS \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/users/$OWNER/packages/npm/$p" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log(j.visibility||('ERR:'+(j.message||'')));}catch(e){console.log('PARSE_ERR');}});")
            echo "$p -> $vis"
            [ "$vis" = "public" ] || all_public=false
          done
          echo "ALL_PUBLIC=$all_public"
          if [ "$all_public" != "true" ]; then
            echo "::warning title=Packages 仍为 private::GitHub REST API 无修改可见性端点，请在网页端操作：github.com/users/$OWNER/packages → Package settings → Change visibility → Public"
          fi

      - name: Note (why CI cannot change it)
        run: |
          echo "GitHub REST API 未提供包可见性写入端点（实测两份候选路径均 404 Not Found）。"
          echo "因此本工作流只做核验，不做修改；可见性需由仓库所有者在网页端手动置为 Public。"
