bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16
always-show-logo no
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data
# 安全加固：启用保护模式，禁止外部未认证访问（即使 bind 0.0.0.0 也拒绝无密码连接）
protected-mode yes
# requirepass 必须通过 docker-compose command 参数注入：--requirepass ${REDIS_PASSWORD}
# 下方默认值仅作 fail-safe（防止误用空配置启动），部署时务必通过命令行参数覆盖
# 直接使用本配置文件启动 redis-server 时也必须修改此默认值
requirepass CHANGE_ME_REDIS_PASSWORD_VIA_DOCKER_COMMAND
maxmemory-policy allkeys-lru
maxmemory-samples 5