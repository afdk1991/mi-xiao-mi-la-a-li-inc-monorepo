# =============================================================================
# 项目004 · Nginx 站点配置（PHP-FPM 上游）
#
# 要点：
#   - 标准 WordPress 固定链接规则（try_files -> index.php?$args）
#   - 静态资源长缓存 + 不记录日志，降低 I/O
#   - 屏蔽敏感路径（.git / .env / 备份文件 / 配置文件）
#   - 禁止在 uploads 目录执行 PHP（最常见的 WordPress 入侵姿势）
# =============================================================================

upstream wp004_php {
    server php:9000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64m;

    # 访问日志按环境决定是否开启（生产建议保留）
    access_log /var/log/nginx/wp004.access.log main;
    error_log  /var/log/nginx/wp004.error.log warn;

    # -------------------------------------------------------------------------
    # 安全响应头
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # -------------------------------------------------------------------------
    # 静态资源缓存
    # -------------------------------------------------------------------------
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|ico|png|jpe?g|gif|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # 敏感文件一律拒绝
    # -------------------------------------------------------------------------
    location ~* (?:^|/)\.(?:git|svn|hg|env|htaccess|htpasswd) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* (?:^|/)(?:wp-config\.php|readme\.html|readme\.txt|license\.txt|\.htaccess|composer\.(?:json|lock)|package(?:-lock)?\.json|phpinfo\.php) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:sql|bak|old|swp|log|zip|tar|gz)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------------------
    # uploads 目录禁止执行 PHP
    # -------------------------------------------------------------------------
    location ~* ^/wp-content/uploads/.*\.php$ {
        deny all;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # WordPress 固定链接
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # -------------------------------------------------------------------------
    # PHP-FPM
    # -------------------------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass   wp004_php;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO       $fastcgi_path_info;
        fastcgi_param  HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param  HTTP_X_FORWARDED_FOR   $http_x_forwarded_for;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # -------------------------------------------------------------------------
    # 健康检查探针
    # -------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
