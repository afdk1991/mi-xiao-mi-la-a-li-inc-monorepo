version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: gexm-server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_TYPE=sqlite
      - DB_PATH=/app/packages/server/data/gexm.db
    volumes:
      - server-data:/app/packages/server/data
      - server-uploads:/app/packages/server/uploads
      - server-logs:/app/packages/server/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: packages/app/Dockerfile
    container_name: gexm-app
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  pc:
    build:
      context: .
      dockerfile: packages/pc/Dockerfile
    container_name: gexm-pc
    ports:
      - "8080:8080"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gexm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: gexm-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=gexm
      - POSTGRES_USER=gexm
      - POSTGRES_PASSWORD=gexm_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gexm"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  server-data:
    driver: local
  server-uploads:
    driver: local
  server-logs:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local