# Grafana 数据源自动配置
# Prometheus 数据源 - 设为默认
apiVersion: 1

datasources:
  # ============================================
  # Prometheus - 指标数据源（默认）
  # ============================================
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: '15s'
      httpMethod: POST
      manageAlerts: false

  # ============================================
  # Loki - 日志数据源
  # ============================================
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
