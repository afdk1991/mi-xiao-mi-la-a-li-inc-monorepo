# Alertmanager 告警通知配置
# 全局配置
global:
  resolve_timeout: 5m           # 告警恢复后多久发送 resolved 通知
  # SMTP 配置（按需启用）
  # smtp_smarthost: 'smtp.example.com:587'
  # smtp_from: 'alertmanager@example.com'
  # smtp_auth_username: 'alertmanager@example.com'
  # smtp_auth_password: 'password'

# 告警模板文件（可选）
# templates:
#   - '/etc/alertmanager/templates/*.tmpl'

# ============================================
# 告警路由配置
# ============================================
route:
  group_by: ['alertname', 'service']    # 按 alertname + service 分组
  group_wait: 30s                       # 首次告警等待 30s（聚合同组告警）
  group_interval: 5m                    # 同组告警下次发送间隔
  repeat_interval: 4h                   # 未解决告警重复发送间隔
  receiver: 'default-webhook'           # 默认接收器

  routes:
    # 严重告警 - 立即发送，不等待分组
    - matchers:
        - severity = "critical"
      receiver: 'critical-webhook'
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1h
      continue: false

    # 警告告警 - 延迟 5 分钟后分组发送
    - matchers:
        - severity = "warning"
      receiver: 'warning-webhook'
      group_wait: 5m
      group_interval: 10m
      repeat_interval: 4h
      continue: false

# ============================================
# 告警接收器配置
# ============================================
receivers:
  # 默认接收器 - Webhook（预留配置，部署时替换实际地址）
  - name: 'default-webhook'
    webhook_configs:
      - url: 'http://localhost:3000/api/alerts/webhook'
        send_resolved: true
        max_alerts: 0

  # 严重告警接收器 - 立即通知
  - name: 'critical-webhook'
    webhook_configs:
      - url: 'http://localhost:3000/api/alerts/critical'
        send_resolved: true
        max_alerts: 0
    # 邮件通知（按需启用）
    # email_configs:
    #   - to: 'oncall@example.com'
    #     send_resolved: true
    #     headers:
    #       Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'

  # 警告告警接收器 - 分组通知
  - name: 'warning-webhook'
    webhook_configs:
      - url: 'http://localhost:3000/api/alerts/warning'
        send_resolved: true
        max_alerts: 0

# ============================================
# 告警抑制规则
# ============================================
inhibit_rules:
  # 当 critical 告警触发时，抑制同服务的 warning 告警
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['alertname', 'service']

  # 当服务宕机告警触发时，抑制该服务的其他告警
  - source_matchers:
      - alertname = "ServiceDown"
    target_matchers:
      - severity = "warning"
    equal: ['instance']
