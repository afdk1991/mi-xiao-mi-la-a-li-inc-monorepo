user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 100;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name localhost;
        root /var/www/html;
        index index.php index.html index.htm;

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 120;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ~ /\. {
            deny all;
        }

        location ~* wp-config\.php {
            deny all;
        }

        # 阻止 HTTP 直接访问敏感目录与文件（包括 API 安全日志）
        # - wp-content/logs/         : MixM Laal API 请求日志（含 IP / API 端点 / UA）
        # - wp-content/uploads/logs/ : 部分插件可能写入日志
        # - wp-content/backups/      : 备份文件
        # - wp-content/cache/        : 缓存可能包含敏感信息
        # - *.log / *.sql / *.bak    : 日志、SQL 转储、备份
        location ~* ^/wp-content/(logs|backups|cache|debug\.log) {
            deny all;
            return 403;
        }

        location ~* \.(log|sql|bak|bak\.[0-9]+|dump|swp)$ {
            deny all;
            return 403;
        }
    }
}