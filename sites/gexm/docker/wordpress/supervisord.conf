[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm.log

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
# 安全说明：nginx 必须以 root 启动以绑定特权端口 80 并读取 SSL 证书；
# 实际请求处理由 nginx.conf 中的 `user www-data;` 指令降权到 www-data 执行，
# master 进程保留 root 但不直接处理用户请求，符合 nginx 官方安全实践。
user=root
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.log